<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星之所向 · 人类群星闪耀时</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --font-serif: 'Noto Serif SC', 'Source Han Serif SC', 'STSong', 'SimSun', serif;
    --font-sans: 'Noto Sans SC', 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    --font-display: 'Cinzel', 'Times New Roman', serif;
    --neon-cyan: #ffd479;
    --text-primary: #f5ecd9;
    --text-secondary: #b8a888;
    --text-muted: #6b5d44;
    --border-faint: rgba(184, 134, 47, 0.18);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  html, body {
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    background:
      radial-gradient(ellipse 120% 100% at 50% 0%, #1a1a40 0%, #131336 25%, #0a0a24 55%, #020408 100%),
      #020408;
    font-family: var(--font-sans);
    color: var(--text-primary);
  }

  canvas#starCanvas {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
  }

  .nebula {
    position: fixed;
    inset: -20%;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(circle at 30% 20%, rgba(90, 70, 180, 0.22) 0%, transparent 45%),
      radial-gradient(circle at 70% 40%, rgba(60, 40, 140, 0.18) 0%, transparent 40%),
      radial-gradient(circle at 50% 80%, rgba(120, 80, 180, 0.12) 0%, transparent 50%);
    filter: blur(60px);
    opacity: 0.8;
  }

  .page {
    position: relative;
    z-index: 3;
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    background: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
  }

  .title-area {
    position: relative;
    z-index: 3;
    text-align: center;
    margin-top: 12vh;
    pointer-events: none;
    transition: opacity 0.6s ease, transform 0.6s ease;
  }
  .title-area.faded {
    opacity: 0;
    transform: translateY(-20px);
  }
  .title {
    font-family: var(--font-serif);
    font-size: clamp(36px, 7vw, 72px);
    font-weight: 900; letter-spacing: 12px;
    background: linear-gradient(180deg, #ffd479 20%, #8b6914 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    filter: drop-shadow(0 0 20px rgba(255,212,121,0.4));
  }
  .subtitle {
    font-family: var(--font-display);
    font-size: 11px; letter-spacing: 10px;
    color: rgba(255,212,121,0.35); margin-top: 8px;
  }
  .hint {
    margin-top: 14px;
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 2px;
  }

  .back-link {
    position: fixed; top: 24px; left: 32px; z-index: 10;
    font-family: var(--font-sans);
    font-size: 13px; letter-spacing: 3px;
    color: rgba(255,255,255,0.4); text-decoration: none;
    transition: color 0.3s;
    pointer-events: auto;
  }
  .back-link:hover { color: rgba(255,212,121,0.8); }

  /* 抽卡按钮 */
  .draw-btn {
    position: relative; z-index: 5;
    margin-top: 8vh;
    padding: 18px 56px;
    background: rgba(255,255,255,0.04);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.5s ease;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.08),
      0 4px 24px rgba(0,0,0,0.4),
      0 0 0 rgba(255,255,255,0);
    color: #fff;
  }
  .draw-btn:hover {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.25);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.12),
      0 6px 32px rgba(0,0,0,0.5),
      0 0 40px rgba(255,255,255,0.08);
    transform: translateY(-2px);
  }
  .draw-btn:active { transform:scale(0.96); }
  .draw-btn.hidden { opacity: 0; pointer-events: none; transform: scale(0.9); }
  .btn-text {
    font-family: var(--font-serif);
    font-size: 20px; letter-spacing: 8px;
    text-shadow: 0 0 20px rgba(255,255,255,0.4);
  }
  .btn-sub {
    font-family: var(--font-display);
    font-size: 9px; letter-spacing: 6px;
    color: rgba(255,255,255,0.4);
  }

  /* 科学家卡片 */
  .card-stage {
    position: absolute;
    inset: 0;
    z-index: 6;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    padding: 20px;
  }
  .scientist-card {
    position: relative;
    width: min(380px, 90vw);
    padding: 30px 28px 24px;
    background: rgba(8, 6, 2, 0.82);
    border: 1px solid var(--border-faint);
    border-radius: 20px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 24px 64px rgba(0,0,0,0.55);
    text-align: center;
    cursor: grab;
    pointer-events: auto;
    transform: translate(0, 0) rotate(0deg);
    transition: transform 0.1s linear, opacity 0.2s ease;
    touch-action: none;
    max-height: 88vh;
    max-height: 88dvh;
    overflow-y: auto;
  }
  .scientist-card:active { cursor: grabbing; }
  .scientist-card.swipe-left { transition: transform 0.4s ease, opacity 0.35s ease; }
  .scientist-card.swipe-right { transition: transform 0.4s ease, opacity 0.35s ease; }
  .card-avatar {
    width: 104px; height: 104px;
    border-radius: 50%;
    object-fit: cover;
    margin: 0 auto 16px;
    border: 2px solid rgba(255,212,121,0.3);
    box-shadow: 0 0 30px rgba(255,212,121,0.18);
  }
  .card-name {
    font-family: var(--font-serif);
    font-size: 25px;
    font-weight: 700;
    letter-spacing: 4px;
    margin-bottom: 4px;
  }
  .card-title {
    font-size: 12px;
    color: var(--neon-cyan);
    letter-spacing: 1.5px;
    margin-bottom: 4px;
    padding: 0 6px;
  }
  .card-years {
    font-family: var(--font-display);
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 2px;
    margin-bottom: 18px;
    opacity: 0.8;
  }
  .card-divider {
    width: 36px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,212,121,0.4), transparent);
    margin: 0 auto 16px;
  }
  .card-contrib {
    font-family: var(--font-serif);
    font-size: 13.5px;
    line-height: 1.75;
    color: var(--text-primary);
    padding: 0 6px;
    margin-bottom: 20px;
    text-align: justify;
    text-align-last: center;
  }
  .card-impact {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 22px;
    padding: 10px 14px;
    background: rgba(255,212,121,0.05);
    border: 1px solid rgba(255,212,121,0.15);
    border-radius: 10px;
  }
  .impact-label {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 2px;
    white-space: nowrap;
  }
  .impact-stars {
    font-size: 14px;
    color: var(--neon-cyan);
    letter-spacing: 2px;
    text-shadow: 0 0 8px rgba(255,212,121,0.5);
  }
  .impact-stars .dim { color: rgba(255,212,121,0.18); text-shadow: none; }
  .card-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .card-btn {
    padding: 10px 18px;
    background: transparent;
    border: 1px solid var(--border-faint);
    border-radius: 24px;
    color: var(--text-secondary);
    font-size: 12px;
    letter-spacing: 1.5px;
    cursor: pointer;
    transition: all 0.25s ease;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .card-btn:hover { border-color: var(--neon-cyan); color: var(--neon-cyan); }
  .card-btn.primary {
    background: linear-gradient(135deg, rgba(255,212,121,0.22), rgba(255,212,121,0.1));
    border-color: var(--neon-cyan);
    color: var(--neon-cyan);
    font-weight: 500;
    padding-right: 14px;
  }
  .card-btn.primary:hover {
    background: linear-gradient(135deg, rgba(255,212,121,0.32), rgba(255,212,121,0.16));
    box-shadow: 0 0 20px rgba(255,212,121,0.25);
  }
  .card-btn .arrow { font-size: 14px; transition: transform 0.25s ease; }
  .card-btn.primary:hover .arrow { transform: translateX(3px); }

  .swipe-hint {
    position: absolute;
    bottom: 22px;
    left: 0; right: 0;
    text-align: center;
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 2px;
    z-index: 4;
    opacity: 0.8;
    transition: opacity 0.4s;
  }
  .swipe-hint.hidden { opacity: 0; }

  @media (max-width: 768px) {
    .title { letter-spacing: 6px; }
    .back-link { top: 16px; left: 18px; }
    .draw-btn { padding: 16px 44px; }
    .scientist-card { padding: 24px 20px 20px; }
    .card-avatar { width: 88px; height: 88px; }
    .card-name { font-size: 22px; letter-spacing: 3px; }
    .card-contrib { font-size: 13px; line-height: 1.7; }
    .title-area { margin-top: 8vh; }
  }
</style>

<body>

<div class="nebula"></div>

<div class="page" id="page">

  <a class="back-link" href="index.html" onclick="sessionStorage.setItem('sm_return','1')">← 返回首页</a>

  <div class="title-area" id="titleArea">
    <div class="title">星之所向</div>
    <div class="subtitle">STARLIGHT DESTINY</div>
    <div class="hint">左右拖动卡片可擦掉，点击按钮可抽取下一位</div>
  </div>

  <button class="draw-btn" id="drawBtn">
    <span class="btn-text">触碰星辰</span>
    <span class="btn-sub">TOUCH THE STARS</span>
  </button>

  <div class="card-stage" id="cardStage"></div>

</div>

<script src="scientists_all.js"></script>
